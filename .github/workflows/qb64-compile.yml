name: QB64 compile and QB4.5 syntax smoke check

on:
  push:
    branches: [main]
    paths:
      - qb64/**
      - qb45/**
      - tests/test_qb64_port_v030.py
      - tests/test_qb45_port.py
      - .github/workflows/qb64-compile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-qb64:
    name: Compile QB64 frontend (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Static port invariants
        run: |
          python -m unittest discover -s tests -p test_qb64_port_v030.py -v
          python -m unittest discover -s tests -p test_qb45_port.py -v
      - name: Install QB64PE build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev
      - name: Download official pinned QB64-PE Linux source distribution
        run: |
          curl --fail --location --retry 3 --show-error \
            https://github.com/QB64-Phoenix-Edition/QB64pe/releases/download/v4.7.0-GLFW/qb64pe_lnx-x64-4.7.0-GLFW.tar.gz \
            -o /tmp/qb64pe-linux.tar.gz
          mkdir -p /tmp/qb64pe-extract
          tar -xzf /tmp/qb64pe-linux.tar.gz -C /tmp/qb64pe-extract
      - name: Build QB64-PE and compile Miner's Claim
        shell: bash
        run: |
          set -euo pipefail
          setup="$(find /tmp/qb64pe-extract -name setup_lnx.sh -type f -print -quit)"
          test -n "$setup"
          cd "$(dirname "$setup")"
          chmod +x ./setup_lnx.sh
          mkdir -p "$HOME/.local/share/applications"
          # QB64-PE's installer launches the graphical IDE after building.
          # A headless CI runner cannot open that window, but the CLI compiler
          # is already built. Accept the final GUI-launch failure only when
          # the resulting executable exists.
          # Installation builds the CLI, then attempts to launch the GUI.
          # Bound that optional GUI launch: the source compiler must exist.
          timeout --signal=TERM --kill-after=5s 90s ./setup_lnx.sh </dev/null || true
          test -x ./qb64pe
          ./qb64pe -x "$GITHUB_WORKSPACE/qb64/MinersClaim_QB64_v0.3.0.bas" -o "$GITHUB_WORKSPACE/miners-claim-qb64-v0.3.0"
          test -s "$GITHUB_WORKSPACE/miners-claim-qb64-v0.3.0"
      - name: Smoke-compile QB4.5 source using QB64-PE BASIC parser
        shell: bash
        run: |
          set -euo pipefail
          qb64="$(find /tmp/qb64pe-extract -name qb64pe -type f -executable -print -quit)"
          test -n "$qb64"
          cd "$(dirname "$qb64")"
          ./qb64pe -x "$GITHUB_WORKSPACE/qb45/MINER45.BAS" -o "$RUNNER_TEMP/miner45-compat"
          test -s "$RUNNER_TEMP/miner45-compat"
          echo "QB64 syntax smoke check succeeded; this is NOT a Microsoft QB4.5 compilation."
      - name: Preserve tested Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: miners-claim-qb64-v0.3.0-linux-x64
          path: miners-claim-qb64-v0.3.0
          if-no-files-found: error
